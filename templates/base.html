{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ToQo{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'toqo.css' %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}"><span class="brand-mark">TQ</span> ToQo</a>
    <nav class="topnav">
      {% block topnav %}{% endblock %}
      {% if user.is_authenticated %}
        <a href="{% url 'home' %}">My tournaments</a>
        <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}
          <button class="linklike" type="submit">Log out ({{ user.username }})</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a class="btn btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  {% block body %}{% endblock %}
  <script src="{% static 'toqo.js' %}"></script>
</body>
</html>
