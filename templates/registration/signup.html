{% extends "base.html" %}
{% block title %}Sign up · ToQo{% endblock %}
{% block body %}
<div class="auth panel">
  <h1>Create your account</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted small">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
